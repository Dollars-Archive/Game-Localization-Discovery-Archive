name: One-shot fix Pages table header overlap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'One-shot fix Pages table header overlap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove sticky table header overlap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/assets/style.css')
          text = p.read_text(encoding='utf-8')
          old = '.candidate-table th { position: sticky; top: 53px; z-index: 5; background: #f8f4ec; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .02em; }'
          new = '.candidate-table th { position: static; background: #f8f4ec; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .02em; }'
          if old not in text:
              raise SystemExit('Target CSS rule not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/style.css
          git commit -m 'fix: prevent candidate rows from sliding under table header'
          git push
