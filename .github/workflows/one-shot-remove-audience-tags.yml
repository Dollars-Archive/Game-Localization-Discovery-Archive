name: One-shot remove audience classification fields

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'One-shot remove audience classification fields'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove audience classification fields from Markdown
        run: |
          python - <<'PY'
          from pathlib import Path

          needles = ('여성향·오토메·BL 여부', '남성향 여부')
          changed = []
          for path in Path('.').rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              new_lines = [line for line in lines if not any(n in line for n in needles)]
              new_text = '\n'.join(new_lines)
              if text.endswith('\n'):
                  new_text += '\n'
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for p in changed:
              print(p)

          leftovers = []
          for path in Path('.').rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              for n in needles:
                  if n in text:
                      leftovers.append((str(path), n))
          if leftovers:
              raise SystemExit(f'Leftovers found: {leftovers}')
          PY

          if git diff --quiet; then
            echo 'No Markdown changes needed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.md' 'platforms/**/*.md' 'templates/*.md' || true
          git add -u
          git commit -m 'docs: remove audience classification fields'
          git push
